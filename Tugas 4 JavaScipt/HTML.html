<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Tugas 4 - JavaScript</title>
        <link rel="stylesheet" href="style.css">
    </head>

<body>
 
    <header>
        <img src="foto abel.jpg" alt="Foto">
        <div>
            <h2>Nama Abel Y Bigail</h2>
            <p>NIM : 255314112</p>
        </div>
    </header>

    <div id="Langkah 1">
        <div class="Baris">Nama : <input type="text" id="nama"></div>

        <button onclick="okPilihan()">OK</button>
    </div>


    <div id="Langkah 4" class="hidden">
        <div class="baris">Email : <input type="text" id="email" placeholder="email@domain.com">
        <button onclick="okEmail()">OK</button></div>
    </div>
