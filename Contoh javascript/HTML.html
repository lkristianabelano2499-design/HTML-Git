<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Program Belajar JavaScript Dasar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            color: darkblue;
        }
        #output {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Program Pembelajaran JavaScript Dasar</h1>
    <p>Klik tombol di bawah untuk menjalankan program.</p>

    <!-- Tombol ini memanggil fungsi dari file contohJS.js -->
    <button onclick="jalankanProgram()">Jalankan Program</button>

    <div id="output"></div>

    <p><b>Selamat Belajar. Terima kasih.</b></p>

    <!-- Ini cara menghubungkan file HTML dengan file JS Eksternal -->
    <script src="contohJS.js"></script>

</body>
</html>
